[project]
name = "astro"
version = "0.1.0"
description = "Local Vedic astrology analysis dashboard"
requires-python = ">=3.12"
dependencies = [
    "pyswisseph>=2.10.3.2",
    "timezonefinder>=6.5.0",
    "fastapi[standard]>=0.115.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
